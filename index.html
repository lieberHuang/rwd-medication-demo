.database-filters :is(input,select){min-width:0;width:100%;color:var(--ink);font:inherit;font-size:13px;padding:7px 9px;border:1px solid #ccdcd6;border-radius:6px;background:#fff}
.database-filters :focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.database-list-heading,.database-field-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 107px;gap:9px;align-items:center}
.database-list-heading{padding:10px 7px 7px;color:#426259;font-size:12px;font-weight:690}
.database-group h3{background:#eaf4ee;color:#29584d;font-size:13px;padding:7px 9px;margin-top:11px;border-radius:5px}
.database-field{border-bottom:1px solid #e7eeea}
.database-field-row{list-style:none;cursor:pointer;padding:9px 7px;color:var(--ink);font-size:13px;min-height:45px}
.database-field-row::-webkit-details-marker{display:none}.database-field-row:hover,.database-field[open] .database-field-row{background:#f1f7f3}
.database-field-name{display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 7px;overflow-wrap:anywhere}.database-field-name::before{content:'›';color:#59796e;font-weight:740}.database-field[open] .database-field-name::before{transform:rotate(90deg)}
.database-field-name strong{font-weight:680}.database-field-name code{color:#506d63;font-size:11px}
.database-field-source{background:#e5f1eb;color:#245d4e;border-radius:4px;font-size:11px;font-weight:660;white-space:nowrap}
.database-field-value{min-width:0;overflow-wrap:anywhere;font-weight:670}.database-field-state{color:#536b60;font-size:12px}
.database-field[data-recorded="true"] .database-field-state{color:#17664e;font-weight:700}
.database-field-details{background:#f7faf8;padding:10px 12px;margin:0 5px 7px;border-radius:6px;color:#395b50;font-size:13px}
.database-schema{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 14px;margin:0}.database-schema div{display:flex;gap:6px;align-items:baseline;min-width:0;font-size:12px}
.database-schema dt{color:#55756a;flex:none}.database-schema dd{margin:0;overflow-wrap:anywhere}.database-field-details h4{margin-top:10px}
.database-history{list-style:none;padding:0;margin:4px 0 0}.database-record{padding:7px 0;border-top:1px solid #e2ebe5;overflow-wrap:anywhere}
.database-record-heading{display:flex;flex-wrap:wrap;gap:3px 9px;align-items:baseline}.database-record-heading span,.database-record-heading time,.database-record p{font-size:12px;color:#536e64}.database-record p{margin-top:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:550px){.dialog-head,.database-controls,.dialog-body{padding-inline:10px}.dialog-head{gap:6px}.dialog-actions{gap:5px}.dialog-head h2{font-size:18px}.dialog-head p{font-size:11px}.database-filters{grid-template-columns:minmax(0,1fr) 91px}.database-filters input{grid-column:1/-1}.database-list-heading,.database-field-row{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) 71px;gap:5px}.database-field-row{font-size:12px}.database-field-state{font-size:11px}.database-field-name code{font-size:10px}.database-schema{grid-template-columns:1fr}}
@media(min-width:1180px){.workspace{grid-template-columns:minmax(376px,.43fr) minmax(0,1fr);gap:33px}.capture-feed{padding-inline:21px}.panel-heading{padding-inline:21px}.turn-summary,.turn-body{padding-inline:14px}.mapping-table th,.mapping-table td{padding-inline:10px}}
@media(max-width:1040px){.shell{width:calc(100% - 48px)}.workspace{gap:17px}.capture-feed{padding-inline:11px}.panel-heading{padding-inline:12px}.totals{gap:4px}.totals span{padding-inline:5px}}
@media(max-width:790px){.shell{width:calc(100% - 28px)}.topbar .shell{height:52px}.brand{font-size:14px}.brand-mark{width:29px;height:29px}h1{padding:20px 0 17px}.workspace{grid-template-columns:minmax(0,1fr);gap:18px;--work-height:clamp(535px,calc(100svh - 116px),689px)}.panel{height:auto;min-height:240px}.capture-feed{overflow:visible}.panel-heading h2{font-size:17px}.turn-summary,.turn-body{padding-inline:10px}}
@media(max-width:390px){.brand{gap:6px}.topbar .btn{padding:6px 7px;font-size:12px}.panel-heading{gap:6px}.panel-icon{width:28px;height:28px}.panel-icon svg{width:15px;height:15px}.panel-heading h2{font-size:15px}.totals{font-size:11px}.capture-feed{padding-inline:8px}.mapping-table{min-width:275px}.mapping-table td,.mapping-table th{padding-inline:5px}.sink{font-size:10px}}

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function markEvidence(container, message, records) {
  container.replaceChildren();
  const sorted = records.flatMap(record => record.evidence).sort((a,b) => a.start - b.start);
  const ranges = [];
  for (const span of sorted) {
    const last = ranges.at(-1);
    if (last && span.start <= last.end) last.end = Math.max(last.end, span.end);
    else ranges.push({start:span.start,end:span.end});
  }
  let offset = 0;
  for (const range of ranges) {
    container.append(document.createTextNode(message.slice(offset, range.start)));
    container.append(element('mark', message.slice(range.start, range.end)));
    offset = range.end;
  }
  container.append(document.createTextNode(message.slice(offset)));
}

function describe(record) {
  const value = record.value;
  const display = Array.isArray(value) ? value.join('、') :
    typeof value === 'object' && value !== null ? Object.entries(value).map(([key,item]) =>
      ({days:'天数',reason:'原因',near_misses:'险情次数',accidents:'事故次数'}[key] ?? key) + ' ' + item).join('、') :
    String(value);
  return record.unit ? display + ' ' + record.unit : display;
}

const databaseKey = 'rwd-medication-demo-v1';
const fallbackKey = databaseKey + '-records';
let databaseConnection;
function openDatabase() {
  if (!databaseConnection) {
    databaseConnection = new Promise((resolve, reject) => {
      const request = indexedDB.open(databaseKey, 1);
      request.onupgradeneeded = () => request.result.createObjectStore('observations', {keyPath:'record_id'});
      request.onerror = () => reject(request.error);
      request.onblocked = () => reject(new Error('Database upgrade blocked'));
      request.onsuccess = () => resolve(request.result);
    }).catch(() => null);
  }
  return databaseConnection;
}

async function useStore(mode, callback) {
  const database = await openDatabase();
  if (!database) return callback(null);
  return new Promise((resolve, reject) => {
    const transaction = database.transaction('observations', mode);
    const result = callback(transaction.objectStore('observations'));
    transaction.oncomplete = () => resolve(result?.result);
    transaction.onabort = () => reject(transaction.error);
    transaction.onerror = () => reject(transaction.error);
  });
}

function readLocalRecords() {
  return useStore('readonly', store => store ? store.getAll() : JSON.parse(localStorage.getItem(fallbackKey) ?? '[]'));
}

const updateLabels = {replace:'覆盖', increment:'累加', append:'追加', merge:'追加'};

function updateKey(record, proposal = record.proposed_update) {
  return JSON.stringify([record.drug,record.patient_id,record.field_code,proposal?.period?.key ?? 'unscoped']);
}

function mergeValues(previous, value) {
  return previous && typeof previous === 'object' && !Array.isArray(previous) &&
    value && typeof value === 'object' && !Array.isArray(value) ? {...previous,...value} : value;
}

function addNumeric(previous, delta) {
  return Number(((typeof previous === 'number' ? previous : 0) + delta).toFixed(8));
}

function incrementValues(previous, delta) {
  if (typeof delta === 'number') return addNumeric(previous,delta);
  const after = {...previous};
  for (const [key, value] of Object.entries(delta)) {
    after[key] = typeof value === 'number' ? addNumeric(previous?.[key],value) : value;
  }
  return after;
}

function asList(value) {
  return value == null ? [] : Array.isArray(value) ? value : [value];
}

function applyUpdates(existing, incoming) {
  const byId = new Map(existing.map(record => [record.record_id,record]));
  const current = new Map();
  const appendCounts = new Map();
  let sequence = 0;

  function register(record) {
    const update = record.update;
    if (!update) return;
    sequence = Math.max(sequence,update.sequence);
    if (update.mode === 'append') {
      const key = updateKey(record);
      appendCounts.set(key, Math.max(appendCounts.get(key) ?? 0, update.number));
    } else if (!current.has(updateKey(record)) || current.get(updateKey(record)).sequence < update.sequence) {
      current.set(updateKey(record),update);
    }
  }

  existing.forEach(register);
  return incoming.map(record => {
    const alreadySaved = byId.get(record.record_id);
    if (alreadySaved?.update) return alreadySaved;
    const proposal = record.proposed_update ?? {mode:'replace',policy:'replace'};
    const key = updateKey(record,proposal);
    const previous = current.get(key);
    const before = previous?.after ?? null;
    const update = {mode:proposal.mode,sequence:++sequence, before,after:record.value};
    if (proposal.period) update.period = proposal.period;
    if (proposal.reason) update.reason = proposal.reason;
    if (proposal.mode === 'append') {
      update.number = (appendCounts.get(key) ?? 0) + 1;
    } else if (proposal.mode === 'increment') {
      update.delta = record.value;
      update.after = incrementValues(before, record.value);
      if (before === null || previous.partial) update.partial = true;
    } else if (proposal.mode === 'merge') {
      update.after = [...new Set([...asList(before),...asList(record.value)])];
    } else if (proposal.policy === 'count') {
      update.after = mergeValues(before, record.value);
    }
    const applied = {...record,update};
    register(applied);
    byId.set(applied.record_id,applied);
    return applied;
  });
}

async function writeLocalRecords(records) {
  const database = await openDatabase();
  if (database) {
    return new Promise((resolve,reject) => {
      const transaction = database.transaction('observations','readwrite');
      const store = transaction.objectStore('observations');
      const existing = store.getAll();
      let applied;
      existing.onsuccess = () => {
        applied = applyUpdates(existing.result,records);
        for (const record of applied) store.put(record);
      };
      transaction.oncomplete = () => resolve(applied);
      transaction.onabort = () => reject(transaction.error);
      transaction.onerror = () => reject(transaction.error);
    });
  }
  const storeLocally = () => {
    const existing = JSON.parse(localStorage.getItem(fallbackKey) ?? '[]');
    const applied = applyUpdates(existing,records);
    const byId = new Map([...existing,...applied].map(record => [record.record_id,record]));
    localStorage.setItem(fallbackKey,JSON.stringify([...byId.values()]));
    return applied;
  };
  return navigator.locks ? navigator.locks.request(fallbackKey,storeLocally) : storeLocally();
}

function updateDescription(record) {
  const update = record.update;
  if (!update) return '';
  const display = value => value == null ? '未记录' : describe({...record,value});
  if (update.mode === 'append') {
    return '第 ' + update.number + ' 条' + (update.reason ? ' · ' + update.reason : '');
  }
  const prefix = update.period?.label ? update.period.label + ' · ' : '';
  if (update.mode === 'increment') {
    return prefix + display(update.before) + ' + ' + display(update.delta) + ' → ' + display(update.after) +
      (update.partial ? '（仅本库已记录增量）' : '');
  }
  return prefix + display(update.before) + ' → ' + display(update.after);
}

const recordsEndpoint = location.protocol !== 'file:' && document.querySelector('meta[name="rwd-records-api"]')?.content;
let cloudPreparation;

async function cloudRecordRequest(token, payload) {
  const writing = payload !== undefined;
  const response = await fetch(recordsEndpoint,{
    method:writing ? 'POST' : 'GET',
    headers:{Authorization:'Bearer ' + token,...(writing ? {'Content-Type':'application/json'} : {})},
    ...(writing ? {body:JSON.stringify(payload)} : {}),
    signal:AbortSignal.timeout(15_000)
  });
  if (!response.ok) throw new Error('云端 RWD 数据库暂时无法访问。');
  const result = await response.json();
  if (!Array.isArray(result.records) || (payload?.records && result.records.length !== payload.records.length)) {
    throw new Error('云端 RWD 数据库返回的数据不完整。');
  }
  return result.records;
}

async function migrateLocalRecords(token) {
  const records = (await readLocalRecords()).filter(row=>row.schema_version === 'v2' && row.drug === drug)
    .sort((a,b)=>(a.update?.sequence ?? 0)-(b.update?.sequence ?? 0));
  const encoder = new TextEncoder();
  let batch = [];
  let bytes = 16;
  for (const record of records) {
    const size = encoder.encode(JSON.stringify(record)).length + 1;
    if (batch.length && (batch.length === 100 || bytes + size > 75_000)) {
      await cloudRecordRequest(token,{records:batch});
      batch = [];
      bytes = 16;
    }
    batch.push(record);
    bytes += size;
  }
  if (batch.length) await cloudRecordRequest(token,{records:batch});
}

function prepareCloudRecords() {
  if (!cloudPreparation) {
    const prepare = async () => {
      const key = databaseKey + '-cloud-access';
      let access = JSON.parse(localStorage.getItem(key) ?? 'null');
      if (!/^[a-f0-9]{64}$/.test(access?.token ?? '')) {
        const token = Array.from(crypto.getRandomValues(new Uint8Array(32)),byte=>byte.toString(16).padStart(2,'0')).join('');
        access = {token,migrated:false};
        localStorage.setItem(key,JSON.stringify(access));
      }
      if (!access.migrated) {
        await migrateLocalRecords(access.token);
        access.migrated = true;
        localStorage.setItem(key,JSON.stringify(access));
      }
      if (!access.paymentProfile) {
        await cloudRecordRequest(access.token,{seed_profile:true});
        localStorage.setItem(key,JSON.stringify({...access,paymentProfile:true}));
      }
      return access.token;
    };
    cloudPreparation = (navigator.locks ? navigator.locks.request(databaseKey + '-cloud-migration',prepare) : prepare())
      .catch(error=>{cloudPreparation = undefined; throw error;});
  }
  return cloudPreparation;
}

async function readRecords() {
  return recordsEndpoint ? cloudRecordRequest(await prepareCloudRecords()) : readLocalRecords();
}

async function writeRecords(records) {
  return recordsEndpoint ? cloudRecordRequest(await prepareCloudRecords(),{records}) : writeLocalRecords(records);
}

const clientCore = new Map(coreFields.map(field => [field.field_code,field]));

function coreKey(field) {
  return field.part ? field.field_code + '.' + field.part : field.field_code;
}

function coreSnapshot(records, session) {
  const recorded = records.filter(row => row.schema_version === 'v2' && row.patient_id === session && row.drug === drug);
  const matching = recorded.filter(row=>clientCore.has(row.field_code));
  const supplementary = new Set(recorded.filter(row=>followupCodes.has(row.field_code) && !clientCore.has(row.field_code))
    .map(row=>row.field_code));
  const ids = new Map(matching.map(row=>[row.record_id,row]));
  const complete = new Set(matching.filter(row=>row.field_code !== 'EX-12').map(row=>row.field_code));
  const lastMissed = matching.filter(row=>row.field_code === 'EX-12')
    .sort((a,b)=>(b.update?.sequence ?? 0)-(a.update?.sequence ?? 0) || b.recorded_at.localeCompare(a.recorded_at))[0];
  const seen = new Set();
  const missedValue = {};
  for (let row = lastMissed; row && !seen.has(row.record_id); row = ids.get(row.related_record_id)) {
    seen.add(row.record_id);
    const value = row.update?.after ?? row.value;
    if (typeof (missedValue.days) !== 'number' && typeof value?.days === 'number') missedValue.days = value.days;
    if (!missedValue.reason && value?.reason) missedValue.reason = value.reason;
  }
  const missed = Object.keys(missedValue);
  if (missed.length === 2) complete.add('EX-12');
  return {complete,missed,lastMissed,supplementary,tagFacts:patientTagFacts(matching)};
}

async function loadCoreSnapshot(session) {

  } catch {
    return coreSnapshot([],session);
  }
}

  const sections = [];
  for (const group of coreGroups) {
    const section = element('section');
    section.append(element('h3',group));
    const items = element('ul');
    for (const field of coreFields.filter(row => row.group === group)) {
      const item = element('li');

        field.field_code === 'EX-12' && snapshot.missed.length ? '待补充' : '未采集';

      label.append(element('code',field.field_code,'core-code'));
      item.append(label,status);
      items.append(item);
    }
    section.append(items);

  }
  wrapper.replaceChildren(...sections);
}

async function syncCoreProgress() {
  const session = control.session;
  const generation = control.generation;
  const snapshot = await loadCoreSnapshot(session);
  if (session === control.session && generation === control.generation) {
    renderCoreProgress(snapshot);
    void refreshPatientTags(snapshot.tagFacts);
  }
  return snapshot;
}

function linkCoreSupplement(record, run) {
  const pending = run.pendingCore;
  if (!pending || record.field_code !== pending.field_code || record.collected_via !== 'follow_up') return record;
  const linked = {...record,followup_of_message_id:pending.messageId};
  if (pending.anchor && record.field_code === 'EX-12') {
    linked.related_record_id = pending.anchor.record_id;
    const period = pending.anchor.proposed_update?.period;
    if (period && !record.proposed_update.period) linked.proposed_update = {mode:'replace',policy:'count',period};
  }
  return linked;
}

function resolveAnsweredFollowup(run) {
  if (!run.pendingCore) return;
  const answered = run.records.some(record=>record.followup_of_message_id === run.pendingCore.messageId &&
    (run.pendingCore.field_code !== 'EX-12' || record.value?.[run.pendingCore.part] !== undefined));
  if (!answered) return;
  const source = control.entries.get(run.pendingCore.messageId);
  if (source?.followup) {
    source.followup.answered = true;
    renderTurn(source);
  }
}

function patientTagFacts(records) {
  const batchTurns = new Map();
  for (const record of records) {
    if (!record.update) continue;
    const batch = record.batch_id ?? record.record_id;
    batchTurns.set(batch,Math.max(batchTurns.get(batch) ?? 0,record.update.sequence));
  }
  const facts = Object.create(null);
  const checklist = [];
  for (const record of records) {
    if (!record.update) continue;
    const code = record.field_code;
    let value = record.update.after ?? record.value;
    if (value == null) continue;
    const turn = batchTurns.get(record.batch_id ?? record.record_id);
    if (code === 'DX-MV-08') {
      checklist.push({record,turn});
      continue;
    }
    if (tagPresence.has(code)) value = true;
    if (code === 'EX-12') {
      value = typeof value === 'number' ? value : value?.days;
      if (!Number.isFinite(value)) continue;
    }
    if (code === 'EX-17') {
      const category = typeof value === 'string' && value.match(/^(未联合|联合)(?:$|[（(：:、，,]|用药|治疗)/);
      if (!category) continue;
      value = category[1];
    }
    if (code === 'AE-AE-07') value = Array.isArray(value) ? value : [value];
    if (typeof value !== 'boolean' && typeof value !== 'number' && typeof value !== 'string' && code !== 'AE-AE-07') continue;
    if (!facts[code] || record.update.sequence > facts[code].sequence) {
      facts[code] = {turn,value,sequence:record.update.sequence};
    }
  }
  if (checklist.length) {
    let mentions = Object.create(null);
    let replaced = 0;
    checklist.sort((a,b)=>a.record.update.sequence-b.record.update.sequence);
    for (const {record,turn} of checklist) {
      if (record.update.mode === 'replace') {
        mentions = Object.create(null);
        replaced = turn;
      }
      for (const name of asList(record.value)) if (typeof name === 'string') mentions[name] = turn;
    }
    const {record,turn} = checklist.at(-1);
    facts['DX-MV-08'] = {turn,value:asList(record.update.after ?? record.value),mentions,replaced};
  }
  return Object.fromEntries(Object.entries(facts).sort(([a],[b])=>a.localeCompare(b))
    .map(([code,{sequence,...fact}])=>[code,fact]));
}

function initializePatientTags() {
  for (const [group,tags] of patientTagGroups) {
    const block = element('section',undefined,'patient-tag-group');
    const label = element('h3',group);
    const items = element('ul');
    for (const [id,name,codes] of tags) {
      const chip = element('li',name,'patient-tag');
      chip.dataset.tag = id;
      chip.title = codes.map(code=>clientCore.get(code).field_name).join('、');
      const state = element('span',undefined,'sr-only');
      chip.append(state);
      items.append(chip);
      tagChips.set(id,{chip,state,name});
    }
    block.append(label,items);
    el('patient-tag-groups').append(block);
  }
  el('patient-tags-retry').addEventListener('click',()=>syncCoreProgress());
}

function renderPatientTags(active, announce = false) {
  const changes = [];
  for (const [id,{chip,state,name}] of tagChips) {
    const lit = active.has(id);
    if (announce && (chip.dataset.active === 'true') !== lit) changes.push(name + (lit ? '已点亮' : '已熄灭'));
    chip.dataset.active = String(lit);
    state.textContent = lit ? '（已点亮）' : '（未点亮）';
  }
  el('patient-tag-count').textContent = active.size + ' 个已点亮';
  el('patient-tags-status').textContent = changes.join('，');
}

function resetPatientTags() {
  tagJob?.abort.abort();
  tagJob = undefined;
  tagSnapshot = undefined;
  el('patient-tags-retry').hidden = true;
  renderPatientTags(new Set());
}

async function refreshPatientTags(facts) {
  if (location.protocol === 'file:') return;
  const body = JSON.stringify({facts});
  if (tagJob?.body === body) return;
  tagJob?.abort.abort();
  tagJob = undefined;
  el('patient-tags-retry').hidden = true;
  if (tagSnapshot === body) return;
  const job = {body,abort:new AbortController()};
  tagJob = job;
  try {
    const response = await fetch(tagsEndpoint,{
      method:'POST',headers:{'Content-Type':'application/json'},body,
      signal:AbortSignal.any([job.abort.signal,AbortSignal.timeout(8000)])
    });
    if (!response.ok) throw new Error('Label status unavailable');
    const result = await response.json();
    if (!Array.isArray(result.active) || !result.active.every(id=>tagChips.has(id))) throw new Error('Invalid label status');
    if (tagJob !== job) return;
    tagSnapshot = body;
    renderPatientTags(new Set(result.active),true);
  } catch {
    if (tagJob === job) el('patient-tags-retry').hidden = false;
  } finally {
    if (tagJob === job) tagJob = undefined;
  }
}

const databaseCategories = [...new Set(databaseFields.map(field=>field[2]))];
const databaseDate = new Intl.DateTimeFormat('zh-CN',{
  year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Shanghai'
});
let databaseView;

function initializeDatabaseView() {
  const category = el('database-category');
  for (const name of databaseCategories) {
    const option = element('option',name);
    option.value = name;
    category.append(option);
  }
  el('database-query').addEventListener('input',renderDatabaseFields);
  for (const id of ['database-category','database-state']) el(id).addEventListener('change',renderDatabaseFields);
  el('database-all-fields').addEventListener('click',()=>showDatabase());
}

function databaseRecord(record) {
  const item = element('li',undefined,'database-record');
  const heading = element('div',undefined,'database-record-heading');
  const time = element('time',databaseDate.format(new Date(record.recorded_at)));
  time.dateTime = record.recorded_at;
  heading.append(element('strong',describe(record)),element('span',record.source === '创新支付' ? '【创新支付】' : record.source ?? record.status),time);
  if (record.source === '创新支付') heading.append(element('span','示例资料'));
  if (record.source && record.status !== record.source && !record.synthetic) heading.append(element('span',record.status));
  item.append(heading);
  if (record.update) item.append(element('p',updateLabels[record.update.mode] + ' · ' + updateDescription(record)));
  const evidence = record.evidence?.map(span=>span.text).filter(Boolean).join('，');
  if (evidence) item.append(element('p','原话「' + evidence + '」'));
  return item;
}

function databaseFieldRow(field, records, expanded) {
  const [code,name,,subcategory,type,options,unit,source,window] = field;
  const item = element('details',undefined,'database-field');
  item.dataset.fieldCode = code;
  item.dataset.recorded = String(records.length > 0);
  item.open = expanded;
  const row = element('summary',undefined,'database-field-row');
  const label = element('span',undefined,'database-field-name');
  label.append(element('strong',name),element('code',code));
  const latest = records[0];
  if (latest?.source === '创新支付') label.append(element('span','【创新支付】','database-field-source'));
  const value = element('span',latest ? describe({...latest,value:latest.update?.after ?? latest.value}) : '—','database-field-value');
  const state = element('span',latest ? '已记录 · ' + records.length + ' 条' : '未记录','database-field-state');
  row.append(label,value,state);
  item.append(row);

  item.addEventListener('toggle',() => {
    if (!item.open || item.childElementCount > 1) return;
    const body = element('div',undefined,'database-field-details');
    const facts = element('dl',undefined,'database-schema');
    const attributes = [['二级分类',subcategory],['变量类型',type],['取值范围 / 选项',options],['单位',unit],['字段设计来源',source],['采集节点',window]];
    for (const [title,text] of attributes) {
      if (!text || text === '—') continue;
      const pair = element('div');
      pair.append(element('dt',title),element('dd',text));
      facts.append(pair);
    }
    body.append(facts);
    if (records.length) {
      const history = element('ol',undefined,'database-history');
      for (const record of records) history.append(databaseRecord(record));
      body.append(element('h4','记录明细'),history);
    }
    item.append(body);
  });
  return item;
}

function renderDatabaseFields() {
  if (!databaseView?.records) return;
  const {batch,records} = databaseView;
  const grouping = new Map();
  const normalized = text=>text.normalize('NFKC').toLocaleLowerCase().replace(/\s+/g,'');
  const query = normalized(el('database-query').value);
  const categoryFilter = el('database-category').value;
  const stateFilter = el('database-state').value;
  let visible = 0;
  for (const field of databaseFields) {
    const [code,name,category] = field;
    const history = records.get(code) ?? [];
    if ((batch && !history.length) || (categoryFilter && categoryFilter !== category) ||
        (stateFilter && (stateFilter === 'recorded') !== Boolean(history.length)) ||
        (query && !normalized(code + name).includes(query))) continue;
    if (!grouping.has(category)) grouping.set(category,[]);
    grouping.get(category).push(databaseFieldRow(field,history,Boolean(batch)));
    visible += 1;
  }
  const body = el('database-contents');
  body.scrollTop = 0;
  el('database-visible-count').textContent = '显示 ' + visible + ' 个字段';
  if (!visible) {
    body.replaceChildren(element('p',batch ? '该批次暂无符合筛选条件的记录。' : '没有符合筛选条件的字段。','empty'));
    return;
  }
  const groups = [];
  for (const [category,fields] of grouping) {
    const group = element('section',undefined,'database-group');
    group.append(element('h3',category),...fields);
    groups.push(group);
  }
  body.replaceChildren(...groups);
}

async function showDatabase(batch) {
  const view = {batch};
  databaseView = view;
  const dialog = el('database');
  el('database-count').textContent = '正在读取记录…';
  el('database-contents').replaceChildren();
  el('database-visible-count').textContent = '';
  el('database-controls').hidden = true;
  el('database-all-fields').hidden = !batch;
  for (const id of ['database-query','database-category','database-state']) el(id).value = '';
  if (!dialog.open) dialog.showModal();
  try {
    const entries = await readRecords();
    if (databaseView !== view || !dialog.open) return;
    const records = entries.filter(item=>item.drug === drug && item.schema_version === 'v2' && (!batch || item.batch_id === batch))
      .sort((a,b)=>b.recorded_at.localeCompare(a.recorded_at) || (b.update?.sequence ?? 0)-(a.update?.sequence ?? 0));
    view.records = new Map();
    for (const record of records) {
      if (!view.records.has(record.field_code)) view.records.set(record.field_code,[]);
      view.records.get(record.field_code).push(record);
    }
    el('database-count').textContent = (batch ? '本批次' : databaseFields.length + ' 个字段') +
      ' · ' + view.records.size + ' 个字段已记录 · ' + records.length + ' 条记录';
    el('database-controls').hidden = false;
    renderDatabaseFields();
  } catch {
    if (databaseView !== view || !dialog.open) return;
    el('database-count').textContent = '读取失败';
    const notice = element('div',undefined,'empty database-error');
    notice.append(element('p','暂时无法读取 RWD 记录。'),action('重试',()=>showDatabase(batch)));
    el('database-contents').replaceChildren(notice);
  }
}


function makeSuggestions(questions) {
  if (!Array.isArray(questions) || questions.length !== 3) return;
  const box = element('section',undefined,'suggestions');
  box.setAttribute('aria-label','猜你想问');
  const list = element('div',undefined,'suggestion-list');
  for (const question of questions) {
    const button = element('button',question,'suggestion');
    button.type = 'button';
    button.disabled = control.busy;
    button.addEventListener('click',() => sendMessage(question,{preserveDraft:true}));
    list.append(button);
  }
  box.append(element('h3','猜你想问'),list);
  return box;
}

function storeOlderSuggestions(owner, suggestions) {
  const history = element('details',undefined,'suggestion-history');
  history.append(element('summary','猜你想问'),suggestions);
  owner.querySelector('.message-content').append(history);
}

function showInlineSuggestions(owner, suggestions) {
  const previous = control.suggestionsOwner;
  const previousBox = previous?.querySelector('.message-content > .suggestions');
  if (previousBox && previous?.isConnected) {
    if (previous === owner) previousBox.remove();
    else storeOlderSuggestions(previous,previousBox);
  }
  owner.querySelector('.message-content').append(suggestions);
  control.suggestionsOwner = owner;
}

function appendMessage(role, value, messageId, time = new Date(), afterMessageId, suggestions, followup) {
  const group = element('article', undefined, 'message ' + role);
  if (messageId) group.id = messageId;
  const content = element('div', undefined, 'message-content');
  const meta = element('div', undefined, 'sr-only');
  const stamp = element('time', formatTime.format(time));
  stamp.dateTime = time.toISOString();
  meta.append(element('strong', role === 'patient' ? '患者' : '奥泽悦助手'), stamp);
  const bubble = element(role === 'patient' ? 'button' : 'div', value, 'bubble');
  if (role === 'patient') {
    bubble.type = 'button';
    bubble.title = '查看对应的数据映射';
    bubble.addEventListener('click', () => locateTurn(messageId));
  }
  content.append(meta, bubble);
  if (role === 'assistant') appendCoreQuestion(content,followup);
  group.append(content);
  const messages = el('messages');
  const anchor = afterMessageId && el(afterMessageId);
  if (anchor) anchor.after(group);
  else messages.append(group);
  const questions = role === 'assistant' && makeSuggestions(suggestions);
  if (questions) {
    if (group.nextElementSibling) storeOlderSuggestions(group,questions);
    else showInlineSuggestions(group,questions);
  }
  if (questions && group.offsetHeight > messages.clientHeight - 16) {
    messages.scrollTop += group.getBoundingClientRect().top - messages.getBoundingClientRect().top - 9;
  } else {
    messages.scrollTop = messages.scrollHeight;
  }
  el('phone-time').textContent = formatTime.format(time);
  return group;
}

function mappingTable(records) {
  const wrap = element('div', undefined, 'mapping-scroll');
  const table = element('table', undefined, 'mapping-table');
  const header = table.createTHead().insertRow();
  for (const name of ['字段名称', '提取值', 'RWD 字段编号']) {
    const column = element('th', name);
    column.scope = 'col';
    header.append(column);
  }
  const body = table.createTBody();
  for (const record of records) {
    const row = body.insertRow();
    const field = row.insertCell();
    const isCore = clientCore.has(record.field_code);
    field.append(element('strong', record.field_name),element('span',isCore ? '核心' : '补充',isCore ? 'field-tier core' : 'field-tier'));
    if (record.followup_of_message_id) field.append(element('div','追问补充','field-review'));
    if (record.status.includes('待核实')) field.append(element('div', '待核实', 'field-review'));
    if (record.collection_window) field.title = record.collection_window;
    row.insertCell().textContent = describe(record);
    const sink = row.insertCell();
    sink.className = 'sink-cell';
    sink.append(element('code', record.field_code, 'sink'));
    if (record.update) {
      const change = body.insertRow();
      change.className = 'update-row';
      const cell = change.insertCell();
      cell.colSpan = 3;
      cell.append(element('span', updateLabels[record.update.mode], 'operation ' + record.update.mode),
        element('span', updateDescription(record), 'update-note'));
    }
  }
  wrap.append(table);
  return wrap;
}

const intentLabels = {symptom:'症状',treatment:'治疗',medication:'用药',history:'既往史'};

const turnStates = {
  recognizing:{label:'DeepSeek 处理中', tone:'neutral'},
  unavailable:{label:'问答失败', tone:'error'},
  analysis_unavailable:{label:'待提取', tone:'error'},
  writing:{label:'正在入库', tone:'neutral'},
  saved:{label:'已入库', tone:'success'},
  skipped:{label:'未入库', tone:'neutral'},
  failed:{label:'入库失败', tone:'error'}
};

function action(label, handler) {
  const button = element('button', label, 'text-action');
  button.type = 'button';
  button.addEventListener('click', handler);
  return button;
}

function setCounts() {
  const saved = Array.from(control.entries.values()).reduce((count, run) =>
    count + (run.status === 'saved' ? run.records.length : 0), 0);
  el('turn-count').textContent = control.entries.size;
  el('record-count').textContent = saved;
}

function renderTurn(run) {
  const {records, status, text, time, messageId, batch, nodes} = run;
  const state = turnStates[status];
  const count = records.length;
  const showRecords = count > 0 && status !== 'recognizing';
  nodes.intent.textContent = intentLabels[run.intent] ?? '';
  nodes.intent.hidden = !nodes.intent.textContent;
  nodes.badge.dataset.tone = state.tone;
  nodes.badge.textContent = status === 'saved' ? '已入库 ' + count + ' 条' : state.label;
  if (showRecords) markEvidence(nodes.quote, text, records);
  else nodes.quote.textContent = text;
  const heading = element('div', undefined, 'turn-actions');
  heading.append(
    element('h3', '提取与入库映射'),
    action('定位对话', () => locateMessage(messageId))
  );
  nodes.body.replaceChildren(heading);
  if (!showRecords) {
    if (status === 'unavailable') nodes.body.append(element('p',run.error,'empty'));
    if (status === 'unavailable' || status === 'analysis_unavailable') {
      nodes.body.append(action(status === 'unavailable' ? '重试问答' : '重试提取', () => requestAnswer(run)));
    }
  } else {
    nodes.body.append(mappingTable(records));
    const receipt = element('div', undefined, 'receipt');
    receipt.dataset.tone = state.tone;
    const marker = element('span');
    marker.innerHTML = icon(status === 'saved' ? 'check' : status === 'failed' ? 'info' : 'clock');
    const label = status === 'saved' ? '已写入 observations · ' + count + ' 条记录' :
      status === 'failed' ? '写入失败' : status === 'writing' ? '正在写入 observations' : '已提取 ' + count + ' 条记录';
    receipt.append(marker, element('strong', label));
    if (status === 'saved') receipt.append(action('查看入库记录', () => showDatabase(batch)));
    if (status === 'failed') receipt.append(action('重试入库', () => persist(run)));
    nodes.body.append(receipt);
    const details = element('details', undefined, 'details');
    details.append(element('summary', '结构化 JSON'), element('pre', JSON.stringify(records, null, 2)));
    nodes.body.append(details);
  }
  const activeQuestion = showCoreFollowup(run);
  if (activeQuestion) nodes.body.append(activeQuestion);
  el('capture-status').textContent = '患者 ' + formatTime.format(time) + '，' + nodes.badge.textContent;
  setCounts();
}

function addTurn(run) {
  control.entries.set(run.messageId, run);
  const feed = el('capture-feed');
  feed.querySelector('.feed-empty')?.remove();
  for (const item of feed.querySelectorAll('.turn[open]')) item.open = false;
  const card = element('details', undefined, 'turn');
  card.id = 'capture-' + run.messageId;
  card.open = true;
  const title = element('summary', undefined, 'turn-summary');
  const stamp = element('time', formatTime.format(run.time));
  stamp.dateTime = run.time.toISOString();
  const author = element('span', '患者', 'turn-author');
  author.append(stamp);
  const meta = element('span', undefined, 'turn-meta');
  const badge = element('span', undefined, 'badge');
  const intent = element('span',undefined,'badge turn-intent');
  const disclosure = element('span', undefined, 'chevron');
  disclosure.innerHTML = icon('chevron');
  meta.append(intent,badge,disclosure);
  const quote = element('span', undefined, 'turn-quote');
  title.append(author, meta, quote);
  const body = element('div', undefined, 'turn-body');
  card.append(title, body);
  run.nodes = {card,badge,intent,quote,body};
  feed.prepend(card);
  feed.scrollTop = 0;
  renderTurn(run);
}

function locateTurn(messageId) {
  const card = control.entries.get(messageId)?.nodes.card;
  if (!card) return;
  card.open = true;
  const feed = el('capture-feed');
  if (window.matchMedia('(max-width:790px)').matches) {
    card.scrollIntoView({block:'start', behavior:'instant'});
  } else {
    feed.scrollTop += card.getBoundingClientRect().top - feed.getBoundingClientRect().top - 12;
  }
}

function locateMessage(messageId) {
  const message = el(messageId);
  if (!message) return;
  for (const visited of document.querySelectorAll('.message.revisit')) visited.classList.remove('revisit');
  message.classList.add('revisit');
  const list = el('messages');
  list.scrollTop += message.getBoundingClientRect().top - list.getBoundingClientRect().top - 10;
  if (window.matchMedia('(max-width:790px)').matches) {
    el('messages').scrollIntoView({block:'nearest', behavior:'instant'});
  }
}

function setBusy(busy) {
  control.busy = busy;
  el('send').disabled = busy || !el('message-input').value.trim();
  for (const button of document.querySelectorAll('.suggestion,.inline-retry,.followup-reply,.assistant-result-note button')) button.disabled = busy;
}

function resizeInput() {
  const input = el('message-input');
  input.style.height = '0px';
  input.style.height = input.scrollHeight + 'px';
}

function syncReplyTarget() {
  const followup = control.activeFollowup;
  el('reply-target').hidden = !followup;
  el('reply-label').textContent = followup ? '补充：' + followup.field_name : '';
  const messages = el('messages');
  for (const button of messages.querySelectorAll('.followup-reply')) {
    button.hidden = button.dataset.messageId !== followup?.messageId;
  }
  const activeQuestion = messages.querySelector('.followup-reply:not([hidden])')?.parentElement;
  if (activeQuestion) {
    const visible = messages.getBoundingClientRect();
    const question = activeQuestion.getBoundingClientRect();
    if (question.top < visible.top) messages.scrollTop += question.top - visible.top - 8;
    else if (question.bottom > visible.bottom) messages.scrollTop += question.bottom - visible.bottom + 8;
  }
}

function beginSession(session, started = new Date()) {
  control.generation += 1;
  control.session = session ?? patientId();
  resetPatientTags();
  control.turns = 0;
  control.pending?.abort();
  control.pending = null;
  control.history = [];
  control.coreAsked.clear();
  control.activeFollowup = null;
  control.suggestionsOwner = null;
  syncReplyTarget();
  control.entries.clear();
  el('messages').replaceChildren();
  const greetingMessage = appendMessage('assistant',greeting,null,started,null,openingSuggestions(new Set()));
  el('message-input').value = '';
  resizeInput();
  el('capture-feed').replaceChildren(element('p', '暂无患者消息', 'empty feed-empty'));
  el('capture-status').textContent = '';
  setCounts();
  renderCoreProgress(coreSnapshot([],control.session));
  syncCoreProgress().then(snapshot=>{
    if (control.suggestionsOwner === greetingMessage) {
      showInlineSuggestions(greetingMessage,makeSuggestions(openingSuggestions(snapshot.complete)));
    }
  });
  setBusy(false);
}

async function persist(run) {
  if (run.generation !== control.generation) return;
  setBusy(true);
  run.status = 'writing';
  renderTurn(run);
  try {
    run.records = await writeRecords(run.records);
    if (run.generation !== control.generation) return;
    run.status = 'saved';
    renderTurn(run);
    resolveAnsweredFollowup(run);
    await syncCoreProgress();
  } catch (error) {
    if (run.generation !== control.generation) return;
    run.status = 'failed';
    renderTurn(run);
  } finally {
    if (run.generation === control.generation) setBusy(false);
  }
}

function assistantNotice(run, message, tone, retryLabel) {
  const group = appendMessage('assistant',message,null,new Date(),run.messageId);
  group.classList.add('assistant-notice',tone);
  if (!retryLabel) {
    group.setAttribute('role','status');
    return group;
  }
  const retry = element('button',retryLabel,'inline-retry');
  retry.type = 'button';
  retry.addEventListener('click',() => requestAnswer(run));
  group.querySelector('.message-content').append(retry);
  return group;
}

async function askGateway(body, signal) {
  for (let attempt=0;attempt<2;attempt+=1) {
    let response;
    try {
      response = await fetch(chatEndpoint,{
        method:'POST',headers:{'Content-Type':'application/json'},body,signal
      });
    } catch (error) {
      if (signal.aborted) throw error;
      if (attempt === 0) continue;
      throw new Error('网络连接暂时中断，请重试原问题。');
    }
    let result;
    try {
      result = await response.json();
    } catch {
      if (signal.aborted) throw signal.reason;
      if (attempt === 0 && response.status >= 500) continue;
      if (response.status === 401 || response.status === 403) throw new Error('页面连接暂未通过，请刷新页面后重试。');
      if (response.status === 429) throw new Error('请求过于频繁，请稍后重试原问题。');
      throw new Error('问答站点暂未返回有效答复，请重试原问题。');
    }
    if (!response.ok) throw new Error(result?.error || '这次问答未完成，请重试原问题。');
    if (typeof result?.answer !== 'string' || !Array.isArray(result.observations)) {
      throw new Error('这次未收到完整回答，请重试原问题。');
    }
    return result;
  }
}

async function requestAnswer(run) {
  if (run.generation !== control.generation || control.busy) return;
  setBusy(true);
  run.status = 'recognizing';
  renderTurn(run);
  run.errorBubble?.remove();
  run.errorBubble = null;
  const waiting = assistantNotice(run,run.answerBubble ? '正在重新提取患者自述…' : '正在回答你的问题…','pending-answer');
  const pending = new AbortController();
  control.pending = pending;
  let timedOut = false;
  const limit = setTimeout(() => {
    timedOut = true;
    pending.abort();
  },42_000);
  const patience = setTimeout(() => {
    waiting.querySelector('.bubble').textContent = '仍在处理，稍等片刻…';
  },5500);
  try {
    if (location.protocol === 'file:') throw new Error('请打开在线页面使用奥泽悦问答。');
    run.coreSnapshot = await loadCoreSnapshot(run.session);
    if (run.generation !== control.generation) return;
    renderCoreProgress(run.coreSnapshot);
    void refreshPatientTags(run.coreSnapshot.tagFacts);
    const previous = run.pendingCore;
    const body = JSON.stringify({
      message:run.text,history:run.history.map(({role,content}) => ({
        role,content:role === 'assistant' ? content.slice(-500) : content.slice(0,500)
      })),
      core:{complete:[...run.coreSnapshot.complete,...run.coreSnapshot.supplementary],missed:run.coreSnapshot.missed,asked:[...control.coreAsked]},
      ...(previous ? {pending_core:{field_code:previous.field_code,part:previous.part,asked_on:previous.asked_on,question:previous.question}} : {})
    });
    const result = await askGateway(body,pending.signal);
    if (run.generation !== control.generation) return;
    waiting.remove();
    try {
      await handleAnswer(run,result);
    } catch {
      throw new Error('页面暂未显示完整结果，请重试原问题。');
    }
  } catch (error) {
    if (run.generation !== control.generation) return;
    waiting.remove();
    run.status = run.answerBubble ? 'analysis_unavailable' : 'unavailable';
    run.error = timedOut ? '这次回答超时，请重试原问题。' : error?.message || '这次问答未完成，请重试原问题。';
    run.errorBubble = assistantNotice(run,run.error,'failed-answer',run.answerBubble ? '重试提取' : '重试原问题');
    renderTurn(run);
  } finally {
    waiting.remove();
    clearTimeout(limit);
    clearTimeout(patience);
    if (control.pending === pending) control.pending = null;
    if (run.generation === control.generation) setBusy(false);
  }
}

async function handleAnswer(run, result) {
  run.intent = result.intent;
  run.records = result.observations.map((record, index) => ({
    record_id:run.batch + '-' + (index + 1), batch_id:run.batch, patient_id:run.session, message_id:run.messageId,
    source:run.initial ? '预设示例' : '患者自报', synthetic:run.initial, recorded_at:run.time.toISOString(),
    schema_version:'v2', engine:result.model, cohort_context:'NT1 · 奥泽悦用药场景', drug, ...linkCoreSupplement(record,run)
  }));
  run.followup = null;
  if (followupCodes.has(result.follow_up?.field_code) && typeof result.follow_up.question === 'string') {
    const anchor = run.records.find(row => row.field_code === 'EX-12') ?? run.coreSnapshot?.lastMissed;
    run.followup = {...result.follow_up,messageId:run.messageId,
      ...(result.follow_up.field_code === 'EX-12' && anchor ? {anchor} : {})};
  }
  run.answerBubble?.remove();
  const suggestions = run.initial ? result.suggestions.map(code=>starterFieldSuggestions[code]) : result.suggestions;
  run.answerBubble = appendMessage('assistant',result.answer,null,run.time,run.messageId,suggestions,run.followup);
  if (result.analysis_pending) {
    const notice = element('div',undefined,'assistant-result-note');
    notice.append(action('重试提取',()=>requestAnswer(run)));
    run.answerBubble.querySelector('.message-content').append(notice);
  }
  if (!run.initial && run.index === control.turns) {
    control.activeFollowup = run.followup ?? null;
    syncReplyTarget();
    if (run.followup) control.coreAsked.add(coreKey(run.followup));
    const assistantText = run.followup ? result.answer + '\n' + run.followup.question : result.answer;
    control.history = [...run.history,
      {role:'user',content:run.text},{role:'assistant',content:assistantText}].slice(-6);
  }
  if (run.records.length) {
    await persist(run);
    return;
  }
  run.status = result.analysis_pending ? 'analysis_unavailable' : 'skipped';
  renderTurn(run);
}

function sendMessage(value, options = {}) {
  const text = value.trim().slice(0,500);
  if (!text || control.busy) return;
  if (!options.initial && control.session === initialSession) {
    control.session = patientId();
    resetPatientTags();
  }
  const {generation, session} = control;
  const index = ++control.turns;
  const batchStem = session + '-' + String(index).padStart(2, '0');
  const initial = Boolean(options.initial);
  const batch = initial ? batchStem : batchStem + '-' + idPart().replaceAll('-', '').slice(-8);
  const messageId = 'message-' + batch;
  const time = options.time ?? new Date();
  const run = {generation, session, index, batch, time, messageId, text, initial,
    history:[...control.history], pendingCore:control.activeFollowup, records:[], status:'recognizing'};
  appendMessage('patient', text, messageId, time);
  addTurn(run);
  if (!options.preserveDraft) el('message-input').value = '';
  resizeInput();
  if (options.result) {
    setBusy(true);
    return handleAnswer(run, options.result).finally(() => {
      if (generation === control.generation) setBusy(false);
    });
  }
  return requestAnswer(run);
}
el('composer').addEventListener('submit', event => {
  event.preventDefault();
  sendMessage(el('message-input').value);
});
el('message-input').addEventListener('input', () => {
  resizeInput();
  setBusy(control.busy);
});
window.addEventListener('resize',resizeInput);
el('message-input').addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
    event.preventDefault();
    if (!el('send').disabled) el('composer').requestSubmit();
  }
});
el('new-session').addEventListener('click', () => {
  beginSession();
  el('message-input').focus({preventScroll:true});
});
el('close-reply').addEventListener('click',() => {
  control.activeFollowup = null;
  syncReplyTarget();
  el('message-input').focus({preventScroll:true});
});
el('open-db').addEventListener('click', () => showDatabase());
document.addEventListener('visibilitychange',()=>{
  if (!document.hidden) void syncCoreProgress();
});

const initialTime = new Date('2026-11-25T10:24:00+08:00');
initializePatientTags();
initializeDatabaseView();
beginSession(initialSession, initialTime);
const initialGeneration = control.generation;
sendMessage(starter, {initial:true, time:initialTime, result:sample}).then(() => {
  if (control.generation !== initialGeneration || control.turns !== 1) return;
  return sendMessage(nextStarter, {initial:true, time:new Date(initialTime.getTime()+120000), result:nextSample});
});
